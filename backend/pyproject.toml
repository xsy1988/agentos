[project]
name = "agent-platform-backend"
version = "0.1.0"
description = "个人 Agent 平台后端（Loop 引擎 + 能力体系）"
requires-python = ">=3.12"
dependencies = [
    # 依赖白名单见 docs/设计方案.md §7；langgraph 系列于 M2 锁版本后引入
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
