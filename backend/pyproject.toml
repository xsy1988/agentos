[project]
name = "agent-platform-backend"
version = "0.1.0"
description = "个人 Agent 平台后端（Loop 引擎 + 能力体系）"
requires-python = ">=3.12"
dependencies = [
    # 依赖白名单见 docs/设计方案.md §7；langgraph 系列已锁版本（M2-2a 冻结）
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "pgvector>=0.3",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain-core==1.6.0",
    "langchain-openai==1.6.0",
    "psycopg[binary]>=3.3.4",
    "cryptography>=50.0.0",
    "langchain-mcp-adapters>=0.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Depends/Query 是 FastAPI 惯用法（不可变调用）
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# 自动生成的迁移文件与一次性验证脚本不改行宽
"migrations/versions/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
