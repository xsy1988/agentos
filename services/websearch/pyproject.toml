[project]
name = "websearch"
version = "0.1.0"
description = "自建网页搜索服务：五级质量漏斗（召回→融合→重排→抽取→缓存），MCP + REST 双出口"
requires-python = ">=3.12"
dependencies = [
    # MCP Server 端与平台客户端同版本（backend 用 mcp 1.29.0 的 streamablehttp_client）
    "mcp==1.29.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # 中文分词（多路召回的关键词路）——隔离区依赖，不入核心进程白名单（设计方案 §7.3）
    "jieba>=0.42",
    # 正文抽取快路（无浏览器）；JS 重页升级到 Crawl4AI 容器
    "trafilatura>=1.12",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websearch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# eval/ 不是安装到环境里的包（它是开发期工具，hatch 只打 src/websearch），
# 但 tests/ 要拿 eval.metrics 做手算对照 → 把仓库根加进 sys.path，让它作为命名空间包可导入
pythonpath = ["."]
