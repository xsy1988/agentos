# 金标集：26 条查询 × 5 类意图切片，供 `python -m eval.run` 出指标、`eval.compare` 做回归门禁。
#
# ## 标注纪律（计划 §6 原文）
#
# 「逐条**实际打开候选 URL 确认其确实回答问题**后才写 grade: 2；无法逐条确认的只标
# domain + grade: 1。」
#
# 这里的「实际打开」是用服务自己的 `POST /fetch`（**不带 question**）把全文取回来，
# 再查 `answer_spans` 是否出现在正文里。每条 grade:2 的 `note` 都写了取证结果
# （命中哪个串、抽到多少字），便于日后复查标注是不是失真。
#
# 为什么必须不带 question：带上它 /fetch 返回的是**片段精选后**的文本，
# 用它取证会把「正文里有、但没被选进片段」的页面误判成不相关（实测 130 个候选里
# 假阴性 29 个）。页面是否相关 与 我们的片段选择是否命中，是两件事，必须分开量。
#
# ## 三个刻意的取舍
#
# 1. **同一页面的不同语言版本只标一条**。实测 MDN 的 429 页面 `/zh-CN/` 与 `/en-US/`
#    会同时进 top10（标题完全相同），流水线已按「去重键忽略语言段」合并成一条；
#    若两条都标注，`ideal_dcg` 会凭空多出一个理想位次，把这条 query 的 nDCG 结构性
#    压到 0.5 以下——那是在惩罚去重做对了。
# 2. **标注权威性 ≠ 可抽取性**。stackoverflow.com、dl.acm.org、arxiv.org/pdf 这几类
#    页面我们的抽取器拿不到正文（实测 UNAVAILABLE），但它们确实是相关答案源，
#    照样标 grade:1~2。这样 nDCG 如实反映排序质量，而「抽不到」的代价落在
#    片段召回率上——两个指标各说一件事，不互相掩盖。
# 3. **volatile: true 的条目不进回归门禁**。时效类查询的结果每天都不一样，
#    把它们算进 nDCG 门禁会让 CI 天天红，红了也没人能判断是代码退化还是新闻换了一批。
#    它们仍然跑、仍然出数，只是 compare.py 不拿它们卡阈值。
#
# ## 覆盖率（读指标时必须一起看）
#
# 26 条查询共 71 条判定：grade:2 有 38 条（全部经 /fetch 全文取证）、grade:1 有 33 条
# （按权威域名推断，或取证后降级的）。金标集必然不完备：没标注的相关页会被算成 0 分，
# 所以 nDCG@10 的绝对值系统性偏低，**只能跨版本对比**。

